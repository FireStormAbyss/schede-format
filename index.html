<style>
/* Layout: bolla di carico da magazzino — barra in alto, contenuto a colonna unica fino a 1180px, tab bar in basso su telefono */
:root {
  --bg: #ECEEEA;
  --surface: #FFFFFF;
  --sunk: #E2E5E0;
  --ink: #16181B;
  --muted: #5B6168;
  --line: #CDD2CB;
  --accent: #2741C4;
  --accent-soft: #E3E7FA;
  --accent-ink: #FFFFFF;
  --warn: #9A5B00;
  --warn-bg: #FBEBCB;
  --ok: #1C7342;
  --ok-bg: #D9F0E1;
  --draft: #646A71;
  --draft-bg: #E2E4E1;
  --danger: #B42318;
  --danger-bg: #FBE3E0;
  --shadow: 0 1px 2px rgba(20,24,30,.06), 0 4px 14px rgba(20,24,30,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --surface: #1A1D20; --sunk: #23272B; --ink: #E8EBE8; --muted: #99A0A7; --line: #32373C;
    --accent: #8197FF; --accent-soft: #232B52; --accent-ink: #0D1230;
    --warn: #F0B456; --warn-bg: #3A2B12; --ok: #63CC8F; --ok-bg: #15301F; --draft: #A2A8AE; --draft-bg: #292D31;
    --danger: #FF8273; --danger-bg: #3B1B18; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --surface: #1A1D20; --sunk: #23272B; --ink: #E8EBE8; --muted: #99A0A7; --line: #32373C;
  --accent: #8197FF; --accent-soft: #232B52; --accent-ink: #0D1230;
  --warn: #F0B456; --warn-bg: #3A2B12; --ok: #63CC8F; --ok-bg: #15301F; --draft: #A2A8AE; --draft-bg: #292D31;
  --danger: #FF8273; --danger-bg: #3B1B18; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }

/* barra superiore */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 20px; min-height: 54px; }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.brand small { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0; opacity: .6; text-transform: none; }
.tabs-top { display: none; gap: 2px; margin-left: auto; }
.tabs-top a { color: inherit; text-decoration: none; font-family: var(--f-display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 14px; border-radius: 6px; opacity: .65; }
.tabs-top a:hover { opacity: 1; }
.tabs-top a[aria-current="page"] { opacity: 1; background: color-mix(in srgb, var(--bg) 16%, transparent); }
@media (min-width: 820px) { .tabs-top { display: flex; } .tabbar { display: none !important; } }

/* tab bar telefono */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 9px; color: var(--muted); text-decoration: none; font-family: var(--f-display); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--accent); }

main { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 110px; }
@media (min-width: 820px) { main { padding-block: 28px 60px; } }

.banner-msg { background: var(--warn-bg); color: var(--warn); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; font-weight: 500; }

/* intestazioni di sezione */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { font-size: clamp(28px, 5vw, 38px); text-transform: uppercase; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* bottoni */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-weight: 600; min-height: 42px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button svg { width: 16px; height: 16px; }

/* campi */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.input, select.input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; min-height: 42px; width: 100%; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.grid-form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

/* pillole stato e format */
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-bozza { background: var(--draft-bg); color: var(--draft); }
.st-inviato { background: var(--warn-bg); color: var(--warn); }
.st-caricato { background: var(--ok-bg); color: var(--ok); }
.fmt { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
.fmt i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); flex: none; }

/* agenda */
.day { margin-bottom: 22px; }
.day-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.day-h h2 { font-size: 22px; text-transform: uppercase; }
.day-h .muted { font-size: 13px; }
.ev-list { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 6px 1fr auto; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-align: left; padding: 0; width: 100%; }
.ev:hover { border-color: var(--muted); }
.ev .stripe { background: var(--c); }
.ev .body { padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.ev .where { font-weight: 600; font-size: 16px; }
.ev .meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 14px; }
.ev .meta .veh { display: inline-flex; align-items: center; gap: 6px; }
.ev .meta .veh svg { width: 34px; height: 22px; }
.ev .side { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; padding: 12px 14px 12px 0; }
.ev .prog { font-size: 12.5px; color: var(--muted); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 26px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
details.past { margin-top: 28px; }
details.past summary { cursor: pointer; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 0; }

/* pannello */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 22px; }
.panel h2 { font-size: 22px; text-transform: uppercase; margin-bottom: 12px; }
.hint { font-size: 13.5px; color: var(--muted); }

/* scelta mezzo con immagini */
.veh-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.veh-opt { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 6px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 15px; }
.veh-opt svg { width: 84px; height: 52px; }
.veh-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.veh-opt:disabled { cursor: default; }

/* scheda evento */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); background: none; border: 0; padding: 4px 0; font-weight: 600; margin-bottom: 10px; }
.back svg { width: 18px; height: 18px; }
.sheet-head { display: grid; gap: 16px; grid-template-columns: 1fr; margin-bottom: 18px; }
.sheet-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sheet-title h1 { font-size: clamp(30px, 6vw, 44px); text-transform: uppercase; }
.source { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); background: var(--sunk); padding: 8px 12px; border-radius: 8px; flex-wrap: wrap; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 10; background: var(--bg); padding-block: 8px; }
.group-h { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
.group-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* vista immagini: tessere */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; position: relative; min-width: 0; }
.tile .ic { width: 64px; height: 64px; border-radius: 14px; background: var(--sunk); display: grid; place-items: center; color: var(--ink); }
.tile .ic svg { width: 40px; height: 40px; }
.tile .nm { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; line-height: 1.1; min-height: 2.2em; display: grid; place-items: center; }
.tile.zero { opacity: .62; }
.tile.zero .ic { background: transparent; border: 1px dashed var(--line); }
.tile.on { border-color: var(--ink); }
.stepper { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; width: 100%; max-width: 160px; }
.stepper button { height: 38px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 600; line-height: 1; }
.stepper button:first-child { border-radius: 8px 0 0 8px; }
.stepper button:last-child { border-radius: 0 8px 8px 0; }
.stepper input { height: 38px; width: 100%; min-width: 0; border: 1px solid var(--line); border-left: 0; border-right: 0; text-align: center; font-family: var(--f-mono); font-size: 17px; font-weight: 600; background: var(--surface); -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.unit { font-size: 12px; color: var(--muted); margin-top: -4px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13.5px; font-weight: 600; min-height: 34px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.note-in { width: 100%; border: 0; border-top: 1px dashed var(--line); background: transparent; padding: 6px 2px 0; font-size: 13px; text-align: center; color: var(--muted); }
.note-in:focus { outline: none; color: var(--ink); }
.ro-val { font-family: var(--f-mono); font-size: 22px; font-weight: 600; }

/* vista lista */
.lines { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.line { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "ic nm ctl" "ic nt nt"; column-gap: 12px; row-gap: 4px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.line:first-child { border-top: 0; }
.line .ic { grid-area: ic; width: 36px; height: 36px; display: grid; place-items: center; align-self: start; }
.line .ic svg { width: 28px; height: 28px; }
.line .nm { grid-area: nm; font-weight: 600; }
.line .ctl { grid-area: ctl; display: flex; justify-content: flex-end; }
.line .nt { grid-area: nt; }
.line .note-in { text-align: left; border-top: 0; padding: 0; }
.line.zero .nm, .line.zero .ic { opacity: .55; }
.line .stepper { max-width: 140px; }
@media (min-width: 820px) {
  .line { grid-template-columns: 36px minmax(160px, 1.2fr) minmax(140px, 1fr) 220px; grid-template-areas: "ic nm nt ctl"; }
}

/* magazzino */
.dates { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.date-chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; text-align: center; min-width: 74px; }
.date-chip b { display: block; font-family: var(--f-display); font-size: 20px; line-height: 1; }
.date-chip span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.date-chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.date-chip[aria-pressed="true"] span { color: inherit; opacity: .7; }
.vans { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-bottom: 22px; }
.van { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; text-align: left; display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; align-items: center; }
.van svg { width: 96px; height: 60px; grid-row: span 3; }
.van h3 { font-size: 22px; text-transform: uppercase; }
.van .evs { font-size: 13.5px; color: var(--muted); }
.van[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.load-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ltile { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; position: relative; min-height: 170px; }
.ltile .ic { width: 64px; height: 64px; display: grid; place-items: center; }
.ltile .ic svg { width: 48px; height: 48px; }
.ltile .qty { font-family: var(--f-mono); font-weight: 600; font-size: 26px; line-height: 1; }
.ltile .nm { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; line-height: 1.1; }
.ltile .split { font-size: 12px; color: var(--muted); }
.ltile .nota { font-size: 12.5px; background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 2px 7px; }
.ltile .tick { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.ltile.done { background: var(--ok-bg); border-color: var(--ok); }
.ltile.done .tick { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.ltile.done .ic, .ltile.done .qty, .ltile.done .nm { opacity: .55; }
.ltile .who { font-size: 11.5px; color: var(--ok); }
.lline { display: grid; grid-template-columns: 30px 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); text-align: left; width: 100%; background: var(--surface); border-left: 0; border-right: 0; border-bottom: 0; }
.lines .lline:first-child { border-top: 0; }
.lline .tick { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; }
.lline .ic svg { width: 28px; height: 28px; }
.lline .nm { font-weight: 600; }
.lline .sub { font-size: 12.5px; color: var(--muted); }
.lline .qty { font-family: var(--f-mono); font-weight: 600; font-size: 18px; }
.lline.done { background: var(--ok-bg); }
.lline.done .tick { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.lline.done .nm, .lline.done .qty { text-decoration: line-through; opacity: .6; }
.tick svg { width: 16px; height: 16px; }

/* storico */
.filters { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 14px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 70vh; }
table.sto { border-collapse: separate; border-spacing: 0; font-size: 13.5px; min-width: 100%; }
table.sto th, table.sto td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
table.sto th { position: sticky; top: 0; background: var(--sunk); z-index: 2; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 12.5px; color: var(--muted); vertical-align: bottom; }
table.sto th:nth-child(-n+4), table.sto td:nth-child(-n+4) { text-align: left; }
table.sto td:first-child, table.sto th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.sto th:first-child { z-index: 3; background: var(--sunk); }
table.sto td.z { color: var(--line); }
table.sto th.nt, table.sto td.nt { text-align: left; white-space: normal; min-width: 260px; font-size: 12.5px; color: var(--muted); }
table.sto tr.avg td { background: var(--accent-soft); font-weight: 600; }
table.sto tr.avg td:first-child { background: var(--accent-soft); }
.dot-app { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }

/* impostazioni */
.set-list { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.set-row { display: grid; gap: 8px; grid-template-columns: 40px minmax(0, 1fr); align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; }
.set-row .ic svg { width: 28px; height: 28px; }

.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }

input[type="color"] { width: 44px; height: 36px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

.who-line { font-size: 12px; color: var(--ok); }
.ltile.part, .lline.part { border-color: var(--warn); background: var(--warn-bg); }
.comps { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.comp { font-size: 11.5px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.comp.ok { color: var(--ok); border-color: var(--ok); }
.comp.now { color: var(--warn); border-color: var(--warn); font-weight: 700; }
.next { font-size: 13px; color: var(--warn); }

.tt { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); }

.team-h h2 { font-size: 20px; text-transform: uppercase; }

.team-row { display: grid; grid-template-columns: minmax(0, 360px) 42px; gap: 8px; align-items: center; }
.team-names { display: flex; flex-wrap: wrap; gap: 6px; }
.team-names span { background: var(--sunk); border-radius: 999px; padding: 4px 12px; font-weight: 600; }

.team-ro > div { display: flex; flex-direction: column; }

details.team-dd { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; margin-bottom: 14px; }

.box-h svg { width: 22px; height: 22px; color: var(--muted); flex: none; }

function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

const fmtShort = new Intl.DateTimeFormat('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtWd = new Intl.DateTimeFormat('it-IT', { weekday: 'short' });
const fmtTime = new Intl.DateTimeFormat('it-IT', { hour: '2-digit', minute: '2-digit' });
function dayLabel(iso) { return fmtDay.format(parseISO(iso)); }
function shortDate(iso) { return fmtShort.format(parseISO(iso)); }
function mats() { return S.settings.materiali || DEFAULTS.materiali; }
function matById(id) { return mats().find(m => m.id === id) || { id, nome: id, tipo: 'pezzi', gruppo: 'Scatolone', icona: 'box' }; }
function fmtColor(n) { const f = (S.settings.formati || []).find(f => f.nome === n); return f ? f.colore : '#888'; }
function mezzo(id) { if (!id) return { id: '', nome: 'Da assegnare', tipo: 'nessuno', tinta: 'none' }; return (S.settings.mezzi || []).find(m => m.id === id) || { id, nome: id || '—', tipo: 'furgone', tinta: '#999' }; }
function qn(v) { return (v && typeof v === 'object') ? (Number(v.n) || 0) : (Number(v) || 0); }
function qt(v) { if (v && typeof v === 'object') return v.t || ''; return (typeof v === 'string' && v && isNaN(Number(v))) ? v : ''; }
function isOn(m, v) { if (m.tipo === 'sino') return v === true; if (m.tipo === 'scelta') return !!v; return qn(v) > 0 || !!qt(v); }
function half(v) { const n = Number(v); if (n === 0.5) return '½'; return String(n).replace('.5', '½').replace('.', ','); }
function valText(m, v) {
  if (m.tipo === 'sino') return v === true ? 'Sì' : 'No';
  if (m.tipo === 'scelta') return v || '—';
  const n = qn(v), t = qt(v);
  const num = m.tipo === 'scatole' ? half(n) : String(n);
  if (t) return (n ? num + ' · ' : '') + t;
  return num;
}
function unitText(m) { return m.tipo === 'scatole' ? 'scatole' : (m.tipo === 'pezzi' ? 'pezzi' : ''); }
function stLabel(s) { return { bozza: 'Bozza', inviato: 'Al magazzino', caricato: 'Caricato' }[s] || s; }
function newId() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600); }
function activeItems(ev) { return mats().filter(m => isOn(m, (ev.q || {})[m.id])); }
function progress(ev) { const a = activeItems(ev); const c = a.filter(m => ev.caricati && ev.caricati[m.id]).length; return { done: c, tot: a.length }; }
function applyStorico() { S.storico = S._sd || S._sj || []; scheduleRender(); }
function allPast(excludeId) {
  const app = Object.entries(S.eventi).filter(([id, e]) => id !== excludeId && e.stato !== 'bozza').map(([id, e]) => ({ ...e, _id: id, _src: 'app' }));
  const keys = new Set(app.map(e => e.data + '|' + e.format + '|' + (e.luogo || '').toUpperCase()));
  return app.concat(S.storico.filter(e => !keys.has(e.data + '|' + e.format + '|' + e.luogo)).map(e => ({ ...e, _src: 'archivio' })));
}
function suggest(format, luogo, excludeId) {
  const pool = allPast(excludeId).filter(e => e.format === format).sort((a, b) => b.data.localeCompare(a.data));
  const L = (luogo || '').trim().toUpperCase();
  const same = pool.find(e => e.luogo.toUpperCase() === L);
  const src = same || pool[0];
  if (!src) return { q: {}, label: 'Nessun evento precedente di questo format: parti da zero.' };
  const fm = (S.settings.formati || []).find(f => f.nome === format);
  const esc_ = (fm && fm.esclusi) || [];
  const q = { ...src.q }; esc_.forEach(id => delete q[id]);
  const nomiEsc = esc_.map(id => { const m = matById(id); return m ? m.nome : null; }).filter(Boolean);
  return { q, label: 'Quantità proposte da ' + src.format + ' · ' + src.luogo + ' del ' + shortDate(src.data) + (same ? '' : ' (stesso format, altro luogo)') + (nomiEsc.length ? '. Non proposti per ' + format + ': ' + nomiEsc.join(', ').toLowerCase() + ' (si possono aggiungere a mano).' : '') };
}
function luoghi() { const s = new Set(); S.storico.forEach(e => s.add(e.luogo)); Object.values(S.eventi).forEach(e => e.luogo && s.add(e.luogo)); return [...s].sort(); }

/* ---------- scrittura su db ---------- */
let chain = Promise.resolve();
const pending = {}; const timers = {};
function deepMerge(a, b) { const o = { ...a }; for (const k in b) { o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') ? deepMerge(a[k], b[k]) : b[k]; } return o; }
function stamp() { return { by: S.me, at: new Date().toISOString() }; }
function queueUpdate(id, patch, delay) {
  // aggiorna subito la copia locale, scrive dopo una pausa
  S.eventi[id] = deepMerge(S.eventi[id] || {}, patch);
  pending[id] = deepMerge(pending[id] || {}, patch);
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), delay == null ? 500 : delay);
}
function flush(id) {
  const p = pending[id]; if (!p) return chain; delete pending[id];
  p.agg = stamp();
  chain = chain.then(() => S.db.doc('eventi/' + id).update(p)).catch(err => writeError(err));
  return chain;
}
function writeError(err) {
  const code = err && err.code;
  if (code === 'invalid_argument') { S.canWrite = false; toast('Non hai i permessi per modificare: la pagina passa in sola lettura.'); render(); }
  else if (code === 'quota_exceeded') toast('Database pieno: elimina eventi vecchi per crearne di nuovi.');
  else toast('Salvataggio non riuscito. Controlla la connessione e riprova.');
}
async function createEvent(data) {
  const id = newId();
  const doc = { ...data, stato: 'bozza', caricati: {}, note: data.note || {}, creato: stamp(), agg: stamp() };
  S.eventi[id] = doc;
  try { await S.db.doc('eventi/' + id).set(doc); } catch (e) { delete S.eventi[id]; writeError(e); return null; }
  return id;
}

/* ---------- render ---------- */
let renderPending = false;
function isTyping() { const a = document.activeElement; return a && $app.contains(a) && a.matches('input:not([type=checkbox]):not([type=color]),textarea,select'); }
function scheduleRender() { if (isTyping()) { renderPending = true; return; } render(); }
$app.addEventListener('focusout', () => { setTimeout(() => { if (renderPending && !isTyping()) { renderPending = false; render(); } }, 0); });

function nav() {
  const items = [['agenda', 'Agenda'], ['magazzino', 'Magazzino'], ['storico', 'Storico'], ['impostazioni', 'Impostazioni']];
  const cur = S.view === 'scheda' ? 'agenda' : S.view;
  document.getElementById('tabsTop').innerHTML = items.map(([k, l]) => `<a href="#${k}" ${k === cur ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  document.getElementById('tabbar').innerHTML = items.map(([k, l]) => `<a href="#${k}" ${k === cur ? 'aria-current="page"' : ''}>${UI[k]}<span>${l}</span></a>`).join('');
  const sync = document.getElementById('sync');
  sync.textContent = S.dbState === 'ok' ? (S.canWrite ? '' : 'sola lettura') : (S.dbState === 'loading' ? 'collegamento…' : (S.dbState === 'off' ? 'non collegato' : ''));
}
function render() {
  renderPending = false;
  nav();
  let h = '';
  if (S.dbState === 'login' || S.dbState === 'denied') { $app.innerHTML = vAccesso(); return; }
  if (S.dbState === 'off') h += '<div class="banner-msg">Non riesco a collegarmi al database. Controlla la connessione e ricarica la pagina.</div>';
  else if (S.dbState === 'ok' && !S.canWrite) h += '<div class="banner-msg">Sei in sola lettura: chiedi a chi ha condiviso la pagina l\'accesso da collaboratore per compilare o spuntare.</div>';
  if (S.view === 'agenda') h += vAgenda();
  else if (S.view === 'scheda') h += vScheda();
  else if (S.view === 'magazzino') h += vMagazzino();
  else if (S.view === 'storico') h += vStorico();
  else if (S.view === 'impostazioni') h += vImpostazioni();
  $app.innerHTML = h;
  fillNames();
}
async function fillNames() {
  const els = [...$app.querySelectorAll('[data-uid]')]; if (!els.length || !S.user) return;
  const ids = [...new Set(els.map(e => e.dataset.uid))];
  try { const ps = await S.user.profiles(ids); els.forEach(e => { const p = ps[e.dataset.uid]; e.textContent = (p && p.name) || 'qualcuno'; }); } catch (e) {}
}

/* ----- agenda ----- */
function evCard(id, e) {
  const p = progress(e), m = mezzo(e.mezzo);
  return `<button class="ev" data-act="open" data-id="${id}" style="--c:${esc(fmtColor(e.format))}">
    <span class="stripe"></span>
    <span class="body">
      <span class="fmt"><i></i>${esc(e.format)}</span>
      <span class="where">${esc(e.luogo || 'Luogo da definire')}</span>
      <span class="meta"><span class="veh">${vehSvg(m)}${esc(m.nome)}</span><span>${activeItems(e).length} materiali</span></span>
    </span>
    <span class="side"><span class="pill st-${e.stato}">${stLabel(e.stato)}</span>${e.stato !== 'bozza' ? `<span class="prog num">${p.done}/${p.tot} caricati</span>` : ''}</span>
  </button>`;
}
function vAgenda() {
  const t = todayISO();
  const list = Object.entries(S.eventi).sort((a, b) => a[1].data.localeCompare(b[1].data) || a[1].format.localeCompare(b[1].format));
  const next = list.filter(([, e]) => e.data >= t), past = list.filter(([, e]) => e.data < t).reverse();
  let h = `<div class="head"><div><h1>Agenda</h1><p>Le schede dei prossimi eventi. Compilale e inviale al magazzino.</p></div>
    ${S.canWrite && !S.creating ? `<button class="btn primary" data-act="new">${UI.plus}Nuovo evento</button>` : ''}</div>`;
  if (S.creating) h += vCreate();
  if (S.dbState === 'loading') h += '<div class="empty">Carico le schede…</div>';
  else if (!next.length) h += `<div class="empty"><strong>Nessun evento in programma</strong>Crea una scheda con «Nuovo evento»: le quantità vengono proposte dall'ultimo evento dello stesso format.</div>`;
  else {
    const byDay = {}; next.forEach(([id, e]) => { (byDay[e.data] = byDay[e.data] || []).push([id, e]); });
    for (const d in byDay) h += `<section class="day"><div class="day-h"><h2>${esc(dayLabel(d))}</h2><span class="muted">${byDay[d].length} ${byDay[d].length === 1 ? 'evento' : 'eventi'}</span></div><div class="ev-list">${byDay[d].map(([id, e]) => evCard(id, e)).join('')}</div></section>`;
  }
  if (past.length) h += `<details class="past"><summary>Eventi passati nell'app (${past.length})</summary><div class="ev-list">${past.map(([id, e]) => `<div class="label" style="margin-top:8px">${esc(shortDate(e.data))}</div>` + evCard(id, e)).join('')}</div></details>`;
  return h;
}
function vCreate() {
  const c = S.creating;
  const sug = c.format ? (c.fromQ ? { label: 'Quantità copiate dalla scheda duplicata.' } : suggest(c.format, c.luogo)) : null;
  return `<section class="panel" id="createPanel"><h2>${c.fromQ ? 'Duplica scheda' : 'Nuovo evento'}</h2>

      <label class="field"><span class="label">Format</span><select class="input" id="c_format" data-cf="format"><option value="">Scegli…</option>${S.settings.formati.map(f => `<option ${f.nome === c.format ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></label>
      <label class="field"><span class="label">Luogo</span><input class="input" id="c_luogo" data-cf="luogo" list="luoghiList" value="${esc(c.luogo)}" placeholder="es. JESOLO" autocomplete="off"></label>

    ${sug ? `<p class="hint" style="margin:14px 0 0">${esc(sug.label)}</p>` : ''}
    <div class="row" style="margin-top:16px"><button class="btn primary" data-act="create" ${c.format && c.data ? '' : 'disabled'}>Crea scheda</button><button class="btn ghost" data-act="cancel-new">Annulla</button></div>
  </section>`;
}
function vehPicker(sel, act, disabled) {
  return `<div class="veh-pick">${S.settings.mezzi.map(m => `<button type="button" class="veh-opt" data-act="${act}" data-v="${esc(m.id)}" aria-pressed="${m.id === sel}" ${disabled ? 'disabled' : ''}>${vehSvg(m)}${esc(m.nome)}</button>`).join('')}</div>`;
}

/* ----- scheda evento ----- */
function control(m, v, locked, evId) {
  if (locked) return `<span class="ro-val">${esc(valText(m, v))}</span>`;
  if (m.tipo === 'sino') return `<div class="chips"><button class="chip" data-act="q" data-k="${m.id}" data-v="no" aria-pressed="${v !== true}">No</button><button class="chip" data-act="q" data-k="${m.id}" data-v="si" aria-pressed="${v === true}">Sì</button></div>`;
  if (m.tipo === 'scelta') return `<div class="chips"><button class="chip" data-act="q" data-k="${m.id}" data-v="" aria-pressed="${!v}">—</button>${(m.opzioni || []).map(o => `<button class="chip" data-act="q" data-k="${m.id}" data-v="${esc(o)}" aria-pressed="${v === o}">${esc(o)}</button>`).join('')}</div>`;
  const step = m.tipo === 'scatole' ? 0.5 : 1;
  return `<div class="stepper"><button data-act="step" data-k="${m.id}" data-d="${-step}" aria-label="Meno ${esc(m.nome)}">−</button><input type="number" inputmode="decimal" min="0" step="${step}" id="q_${m.id}" data-qk="${m.id}" value="${qn(v)}" aria-label="${esc(m.nome)}"><button data-act="step" data-k="${m.id}" data-d="${step}" aria-label="Più ${esc(m.nome)}">+</button></div>` + ((m.tipologie || []).length ? `<div class="chips">${m.tipologie.map(o => `<button class="chip" data-act="qt" data-k="${m.id}" data-v="${esc(o)}" aria-pressed="${qt(v) === o}">${esc(o)}</button>`).join('')}</div>` : '');
}
function vScheda() {
  const id = S.editing, e = S.eventi[id];
  if (!e) return `<button class="back" data-act="go-agenda">${UI.back}Agenda</button><div class="empty"><strong>Scheda non trovata</strong>Potrebbe essere stata eliminata.</div>`;
  const locked = e.stato !== 'bozza' || !S.canWrite;
  const q = e.q || {}, note = e.note || {};
  const visible = mats().filter(m => m.attivo !== false || isOn(m, q[m.id]));
  const shown = locked ? visible.filter(m => isOn(m, q[m.id])) : visible;
  const p = progress(e);
  let h = `<button class="back" data-act="go-agenda">${UI.back}Agenda</button>
  <div class="sheet-head">
    <div class="sheet-title" style="--c:${esc(fmtColor(e.format))}"><h1><span class="fmt" style="font-size:inherit;vertical-align:middle"><i style="width:14px;height:14px"></i></span> ${esc(e.format)} · ${esc(e.luogo || '—')}</h1><span class="pill st-${e.stato}">${stLabel(e.stato)}</span></div>`;
  if (!locked) {
    h += `<div class="grid-form">
      <label class="field"><span class="label">Data</span><input class="input" type="date" id="e_data" data-ef="data" value="${esc(e.data)}"></label>
      <label class="field"><span class="label">Format</span><select class="input" id="e_format" data-ef="format">${S.settings.formati.map(f => `<option ${f.nome === e.format ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></label>
      <label class="field"><span class="label">Luogo</span><input class="input" id="e_luogo" data-ef="luogo" list="luoghiList" value="${esc(e.luogo)}" autocomplete="off"></label>
    </div><datalist id="luoghiList">${luoghi().map(l => `<option value="${esc(l)}">`).join('')}</datalist>
    <div class="field"><span class="label">Mezzo</span>${vehPicker(e.mezzo, 'e-mezzo')}</div>`;
    if (e.fonte) h += `<div class="source">${esc(e.fonte)}</div>`;
  } else {
    const m = mezzo(e.mezzo);
    h += `<div class="row" style="gap:18px"><span class="label">${esc(dayLabel(e.data))}</span><span class="row" style="gap:6px">${vehSvg(m).replace('<svg', '<svg style="width:46px;height:30px"')}<b>${esc(m.nome)}</b></span>${e.stato !== 'bozza' ? `<span class="num muted">${p.done}/${p.tot} caricati</span>` : ''}</div>`;
  }
  h += `</div>`;
  h += teamBlock(e, locked);
  h += `<div class="toolbar"><div></div><div class="row">`;
  if (S.canWrite) {
    if (e.stato === 'bozza') h += `<button class="btn primary" data-act="send">Invia al magazzino</button>`;
    else h += (S.armed === 'reopen' ? `<button class="btn danger armed" data-act="reopen">Conferma: riapri${p.done ? ' (le spunte restano)' : ''}</button>` : `<button class="btn" data-act="reopen">Riapri per modificare</button>`);
    h += `<button class="btn" data-act="dup">Duplica</button>`;
    h += S.armed === 'del' ? `<button class="btn danger armed" data-act="del">Conferma eliminazione</button>` : `<button class="btn danger ghost" data-act="del">Elimina</button>`;
  }
  h += `</div></div>`;
  if (!shown.length) h += `<div class="empty"><strong>Nessun materiale</strong>Questa scheda non ha materiali da caricare.</div>`;
  for (const g of GRUPPI.concat(['Altro'])) {
    const items = shown.filter(m => grp(m) === g);
    if (!items.length) continue;
    h += `<div class="group-h ${g === 'Scatolone' ? 'box-h' : ''}">${g === 'Scatolone' ? icon('box') : ''}<span class="label">${GLABEL[g]}</span></div>`;
    if (S.mode === 'immagini') {
      h += `<div class="tiles">` + items.map(m => {
        const v = q[m.id], on = isOn(m, v);
        return `<div class="tile ${on ? 'on' : 'zero'}"><div class="ic">${icon(m.icona)}</div><div class="nm">${esc(m.nome)}</div>${(m.componenti || []).length ? `<div class="comp-hint">+ ${esc(m.componenti.join(', '))}</div>` : ''}${control(m, v, locked, id)}${unitText(m) && !locked ? `<div class="unit">${unitText(m)}</div>` : ''}${locked ? (note[m.id] ? `<div class="hint">${esc(note[m.id])}</div>` : '') : `<input class="note-in" id="n_${m.id}" data-nk="${m.id}" value="${esc(note[m.id] || '')}" placeholder="nota" aria-label="Nota ${esc(m.nome)}">`}${e.caricati && e.caricati[m.id] ? `<div class="who-line">✓ <span data-uid="${esc(e.caricati[m.id].by)}">…</span></div>` : ''}</div>`;
      }).join('') + `</div>`;
    } else {
      h += `<div class="lines">` + items.map(m => {
        const v = q[m.id], on = isOn(m, v);
        return `<div class="line ${on ? '' : 'zero'}"><div class="ic">${icon(m.icona)}</div><div class="nm">${esc(m.nome)}${unitText(m) ? ` <span class="muted" style="font-weight:400;font-size:13px">${unitText(m)}</span>` : ''}${(m.componenti || []).length ? `<div class="comp-hint">+ ${esc(m.componenti.join(', '))}</div>` : ''}${e.caricati && e.caricati[m.id] ? `<div class="who-line">✓ caricato da <span data-uid="${esc(e.caricati[m.id].by)}">…</span></div>` : ''}</div><div class="nt">${locked ? `<span class="hint">${esc(note[m.id] || '')}</span>` : `<input class="note-in" id="n_${m.id}" data-nk="${m.id}" value="${esc(note[m.id] || '')}" placeholder="Nota" aria-label="Nota ${esc(m.nome)}">`}</div><div class="ctl">${control(m, v, locked, id)}</div></div>`;
      }).join('') + `</div>`;
    }
  }
  return h;
}

function persone() { const s = new Set(S.nomi || []); Object.values(S.eventi).forEach(e => (e.team || []).forEach(r => r.persona && s.add(r.persona))); return [...s].sort((x, y) => x.localeCompare(y, 'it')); }

    <button class="btn" data-act="tm-add" style="margin-top:8px">${UI.plus}Aggiungi persona</button>`;
  return h + `</section>`;
}
async function ricordaNome(n) {
  n = (n || '').trim(); if (!n || !S.db || (S.nomi || []).some(x => x.toLowerCase() === n.toLowerCase())) return;
  S.nomi = (S.nomi || []).concat([n]);
  try { await S.db.doc('config/persone').set({ nomi: S.nomi }); } catch (e) {}
}
function setTeam(fn, delay) { const e = S.eventi[S.editing]; const t = (e.team || []).map(r => ({ ...r })); fn(t); queueUpdate(S.editing, { team: t }, delay); }

/* ----- magazzino ----- */
function magDates() {
  const t = todayISO();
  const set = new Set(Object.values(S.eventi).filter(e => e.stato !== 'bozza' && e.data >= t).map(e => e.data));
  return [...set].sort();
}
function vMagazzino() {
  const dates = magDates();
  const d = S.mag.date || dates[0] || todayISO();
  S._magDay = d;
  const dayEv = Object.entries(S.eventi).filter(([, e]) => e.data === d);
  const sent = dayEv.filter(([, e]) => e.stato !== 'bozza');
  const drafts = dayEv.filter(([, e]) => e.stato === 'bozza');
  let h = `<div class="head"><div><h1>Magazzino</h1><p>Scegli il giorno e il mezzo, poi spunta quello che carichi.</p></div>
    <label class="field" style="width:170px"><span class="label">Altro giorno</span><input class="input" type="date" id="m_date" data-mag="date" value="${esc(d)}"></label></div>`;
  const chips = [...new Set(dates.concat([d]))].sort();
  h += `<div class="dates">${chips.map(x => { const dt = parseISO(x); return `<button class="date-chip" data-act="mag-date" data-v="${x}" aria-pressed="${x === d}"><span>${fmtWd.format(dt)}</span><b>${dt.getDate()}</b><span>${dt.toLocaleString('it-IT', { month: 'short' })}</span></button>`; }).join('')}</div>`;
  if (drafts.length) h += `<div class="banner-msg">${drafts.length === 1 ? '1 scheda è ancora in bozza' : drafts.length + ' schede sono ancora in bozza'} per questo giorno (${drafts.map(([, e]) => esc(e.format + ' · ' + e.luogo)).join(', ')}): non compare qui finché l'ufficio non la invia.</div>`;
  if (!sent.length) return h + `<div class="empty"><strong>Niente da caricare il ${esc(dayLabel(d))}</strong>Le schede appaiono qui quando l'ufficio le invia al magazzino.</div>`;
  const byM = {}; sent.forEach(([id, e]) => { (byM[e.mezzo] = byM[e.mezzo] || []).push([id, e]); });
  const ms = Object.keys(byM);
  ms.sort((a, b) => (a === '') - (b === ''));
  if (S.mag.mezzo == null || !(S.mag.mezzo in byM)) S.mag.mezzo = ms[0];
  h += `<div class="vans">${ms.map(mid => {
    const m = mezzo(mid), evs = byM[mid];
    let dn = 0, tt = 0; evs.forEach(([, e]) => { const p = progress(e); dn += p.done; tt += p.tot; });
    const pct = tt ? Math.round(dn / tt * 100) : 0;
    return `<button class="van" data-act="mag-mezzo" data-v="${esc(mid)}" aria-pressed="${mid === S.mag.mezzo}">${vehSvg(m)}<h3>${esc(m.nome)}</h3><span class="evs">${evs.map(([, e]) => esc(e.format + ' · ' + e.luogo)).join('<br>')}${mid ? '' : '<br><b style="color:var(--warn)">Assegna un mezzo nella scheda</b>'}</span><span><span class="bar"><i style="width:${pct}%"></i></span><span class="num muted" style="font-size:12.5px">${dn}/${tt} ${dn === tt && tt ? '· tutto caricato' : 'caricati'}</span></span></button>`;
  }).join('')}</div>`;
  // lista di carico aggregata
  const evs = byM[S.mag.mezzo];
  const withTeam = evs.filter(([, e]) => (e.team || []).some(r => r.persona));
  if (withTeam.length) h += `<details class="team-dd"><summary>Squadra</summary>${withTeam.map(([, e]) => `<div class="team-ev"><span class="fmt" style="font-size:15px;--c:${esc(fmtColor(e.format))}"><i></i>${esc(e.format)} · ${esc(e.luogo)}</span><div class="team-names">${e.team.filter(r => r.persona).map(r => `<span>${esc(r.persona)}</span>`).join('')}</div></div>`).join('')}</details>`;
  const rows = [];
  mats().forEach(m => {
    const parts = evs.filter(([, e]) => isOn(m, (e.q || {})[m.id]));
    if (!parts.length) return;
    let qty, tt = '';
    if (m.tipo === 'pezzi' || m.tipo === 'scatole') { const s = parts.reduce((a, [, e]) => a + qn(e.q[m.id]), 0); const ts = [...new Set(parts.map(([, e]) => qt(e.q[m.id])).filter(Boolean))]; qty = (s || !ts.length ? (m.tipo === 'scatole' ? half(s) : String(s)) : '✓'); tt = ts.join(' + '); }
    else if (m.tipo === 'sino') qty = 'Sì';
    else qty = [...new Set(parts.map(([, e]) => e.q[m.id]))].join(' + ');
    const comps = m.componenti || [], steps = comps.length + 1;
    const stepNow = Math.min(...parts.map(([, e]) => (e.caricati && e.caricati[m.id]) ? steps : ((e.passi || {})[m.id] || 0)));
    const done = stepNow >= steps;
    const by = done ? parts[0][1].caricati[m.id] : null;
    const notes = parts.map(([, e]) => (e.note || {})[m.id]).filter(Boolean);
    const split = parts.length > 1 && (m.tipo === 'pezzi' || m.tipo === 'scatole') ? parts.map(([, e]) => valText(m, e.q[m.id]) + ' ' + e.format).join(' · ') : '';
    rows.push({ m, qty, tt, done, by, notes, split, g: grp(m), comps, stepNow });
  });
  rows.sort((a, b) => (a.done - b.done));
  const left = rows.filter(r => !r.done).length;
  h += `<div class="toolbar"><div><span class="label">Carico ${esc(mezzo(S.mag.mezzo).nome)}</span> <span class="num muted">· ${left ? left + ' da caricare' : 'completo'}</span></div></div>`;
  const dis = S.canWrite ? '' : 'disabled';
  const tileF = r => `<button class="ltile ${r.done ? 'done' : (r.stepNow ? 'part' : '')}" data-act="load" data-k="${r.m.id}" aria-pressed="${r.done}" ${dis}><span class="tick">${r.done ? UI.check : ''}</span><span class="ic">${icon(r.m.icona)}</span><span class="qty">${esc(r.qty)}</span>${r.tt ? `<span class="tt">${esc(r.tt)}</span>` : ''}<span class="nm">${esc(r.m.nome)}</span>${r.comps.length ? `<span class="comps">${r.comps.map((c, i) => `<span class="comp ${r.stepNow > i + 1 ? 'ok' : ''} ${!r.done && r.stepNow === i + 1 ? 'now' : ''}">${r.stepNow > i + 1 ? '✓ ' : ''}${esc(c)}</span>`).join('')}</span>` : ''}${!r.done && r.stepNow > 0 ? `<span class="next">Ora controlla: <b>${esc(r.comps[r.stepNow - 1])}</b></span>` : ''}${r.split ? `<span class="split">${esc(r.split)}</span>` : ''}${r.notes.map(n => `<span class="nota">${esc(n)}</span>`).join('')}${r.by ? `<span class="who"><span data-uid="${esc(r.by.by)}">…</span> · ${fmtTime.format(new Date(r.by.at))}</span>` : ''}</button>`;
  const lineF = r => `<button class="lline ${r.done ? 'done' : (r.stepNow ? 'part' : '')}" data-act="load" data-k="${r.m.id}" aria-pressed="${r.done}" ${dis}><span class="tick">${r.done ? UI.check : ''}</span><span class="ic">${icon(r.m.icona)}</span><span><span class="nm">${esc(r.m.nome)}</span>${r.tt ? ` <span class="tt">${esc(r.tt)}</span>` : ''}${r.comps.length ? `<span class="comps">${r.comps.map((c, i) => `<span class="comp ${r.stepNow > i + 1 ? 'ok' : ''} ${!r.done && r.stepNow === i + 1 ? 'now' : ''}">${r.stepNow > i + 1 ? '✓ ' : ''}${esc(c)}</span>`).join('')}</span>` : ''}${!r.done && r.stepNow > 0 ? `<span class="next">Ora controlla: <b>${esc(r.comps[r.stepNow - 1])}</b></span>` : ''}${r.split || r.notes.length || r.by ? `<span class="sub" style="display:block">${esc([r.split].concat(r.notes).filter(Boolean).join(' · '))}${r.by ? ` ✓ <span data-uid="${esc(r.by.by)}">…</span> ${fmtTime.format(new Date(r.by.at))}` : ''}</span>` : ''}</span><span class="qty">${esc(r.qty)}</span></button>`;
  for (const g of GRUPPI.concat(['Altro'])) {
    const rs = rows.filter(r => r.g === g); if (!rs.length) continue;
    const dn = rs.filter(r => r.done).length;
    const inner = S.mode === 'immagini' ? `<div class="load-tiles">${rs.map(tileF).join('')}</div>` : `<div class="lines">${rs.map(lineF).join('')}</div>`;
    if (g === 'Scatolone') h += `<section class="box-group"><div class="box-top">${icon('box')}<div><h3>Scatolone consumabili</h3><span class="num muted" style="font-size:13px">${dn}/${rs.length} dentro</span></div><button class="btn" data-act="load-group" data-g="Scatolone" ${dis}>${dn === rs.length ? 'Togli spunte' : 'Spunta tutto lo scatolone'}</button></div>${inner}</section>`;
    else h += `<div class="group-h"><span class="label">${GLABEL[g]}</span><span class="num muted" style="font-size:13px">${dn}/${rs.length}</span></div>${inner}`;
  }
  return h;
}

/* ----- storico ----- */

}
function cell(m, v) { if (!isOn(m, v)) return ''; if (m.tipo === 'sino') return 'Sì'; if (m.tipo === 'scelta') return v; return valText(m, v); }

function draft() { if (!S.setDraft) S.setDraft = JSON.parse(JSON.stringify(S.settings)); return S.setDraft; }

/* ---------- eventi UI ---------- */
$app.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act !== 'del' && act !== 'reopen' && act !== 'amm-del') S.armed = null;
  switch (act) {
    case 'new': S.creating = { data: todayISO(), format: '', luogo: '', mezzo: '' }; render(); break;
    case 'cancel-new': S.creating = null; render(); break;
    case 'c-mezzo': S.creating.mezzo = S.creating.mezzo === b.dataset.v ? '' : b.dataset.v; render(); break;
    case 'create': {
      const c = S.creating; const sug = c.fromQ ? { q: c.fromQ, label: c.fonte } : suggest(c.format, c.luogo);
      b.disabled = true;
      const team = [{ persona: '' }];
      const id = await createEvent({ team, data: c.data, format: c.format, luogo: c.luogo.trim().toUpperCase(), mezzo: c.mezzo, q: sug.q, note: c.fromNote || {}, fonte: sug.label });
      if (id) { S.creating = null; S.editing = id; S.view = 'scheda'; toast('Scheda creata'); render(); window.scrollTo(0, 0); }
      break;
    }
    case 'open': S.editing = b.dataset.id; S.view = 'scheda'; render(); window.scrollTo(0, 0); break;
    case 'go-agenda': if (S.editing) await flush(S.editing); S.view = 'agenda'; S.editing = null; render(); break;
    case 'mode': S.mode = b.dataset.v; lsSet('mode', S.mode); render(); break;
    case 'e-mezzo': queueUpdate(S.editing, { mezzo: S.eventi[S.editing].mezzo === b.dataset.v ? '' : b.dataset.v }, 0); render(); break;
    case 'q': { const m = matById(b.dataset.k); const v = m.tipo === 'sino' ? b.dataset.v === 'si' : b.dataset.v; queueUpdate(S.editing, { q: { [m.id]: v } }); render(); break; }
    case 'step': {
      const k = b.dataset.k, e = S.eventi[S.editing]; const cur = qn((e.q || {})[k]);
      const nv = Math.max(0, Math.round((cur + Number(b.dataset.d)) * 2) / 2);
      queueUpdate(S.editing, { q: { [k]: matById(k).tipologie ? { n: nv, t: qt((e.q || {})[k]) } : nv } });
      render();
      break;
    }
    case 'tm-add': setTeam(t => t.push({ persona: '' }), 300); render(); { const n = document.getElementById('tm_p_' + ((S.eventi[S.editing].team || []).length - 1)); if (n) n.focus(); } break;
    case 'tm-del': setTeam(t => t.splice(+b.dataset.i, 1), 0); render(); break;
    case 'qt': { const k = b.dataset.k, cur = qt((S.eventi[S.editing].q || {})[k]); queueUpdate(S.editing, { q: { [k]: { n: qn((S.eventi[S.editing].q || {})[k]), t: cur === b.dataset.v ? '' : b.dataset.v } } }); render(); break; }
    case 'load-group': toggleGroup(b.dataset.g); break;
    case 'send': await flush(S.editing); queueUpdate(S.editing, { stato: 'inviato', inviato: stamp() }, 0); toast('Inviata al magazzino'); render(); break;
    case 'reopen':
      if (S.armed !== 'reopen') { S.armed = 'reopen'; render(); break; }
      S.armed = null; queueUpdate(S.editing, { stato: 'bozza' }, 0); render(); break;
    case 'del':
      if (S.armed !== 'del') { S.armed = 'del'; render(); break; }
      S.armed = null; { const id = S.editing; clearTimeout(timers[id]); delete pending[id]; delete S.eventi[id]; S.view = 'agenda'; S.editing = null; render();
        chain = chain.then(() => S.db.doc('eventi/' + id).delete()).then(() => toast('Scheda eliminata')).catch(writeError); }
      break;
    case 'dup': { const e = S.eventi[S.editing]; S.creating = { data: e.data, format: e.format, luogo: e.luogo, mezzo: e.mezzo, fromQ: { ...(e.q || {}) }, fromNote: { ...(e.note || {}) }, fonte: 'Copiata da ' + e.format + ' · ' + e.luogo + ' del ' + shortDate(e.data) }; S.view = 'agenda'; S.editing = null; render(); window.scrollTo(0, 0); break; }
    case 'mag-date': S.mag.date = b.dataset.v; S.mag.mezzo = null; render(); break;
    case 'mag-mezzo': S.mag.mezzo = b.dataset.v; render(); break;
    case 'load': toggleLoad(b.dataset.k); break;

  const db = makeDb(); S.db = db; S.user = userApi;
  if (S.admin) loadAmmessi();
  if (CFG.googleClientId) loadGis().catch(() => {});
  db.doc('config/google').onSnapshot(snap => { const id = snap.exists && snap.data().clientId; if (id && id !== CFG.googleClientId) { CFG.googleClientId = id; loadGis().catch(() => {}); scheduleRender(); } }, () => {});
  db.doc('archivio/pdf').onSnapshot(snap => { S._sj = snap.exists ? (snap.data().eventi || []) : null; applyStorico(); }, () => {});
  db.doc('config/persone').onSnapshot(snap => { S.nomi = snap.exists ? (snap.data().nomi || []) : []; }, () => {});
  db.doc('config/impostazioni').onSnapshot(snap => {
    if (snap.exists) { const d = snap.data(); const sm = d.materiali || DEFAULTS.materiali; S.settings = { materiali: sm.concat(DEFAULTS.materiali.filter(x => !sm.some(y => y.id === x.id))), formati: (d.formati || DEFAULTS.formati).map(f => { const df = DEFAULTS.formati.find(x => x.nome === f.nome); return f.esclusi === undefined && df && df.esclusi ? { ...f, esclusi: df.esclusi.slice() } : f; }), mezzi: d.mezzi || DEFAULTS.mezzi }; }
    scheduleRender();
  }, () => {});
  db.collection('storico').onSnapshot(snap => {
    let list = []; S.storicoMeta = null;
    snap.docs.forEach(d => { if (d.id === '_meta') S.storicoMeta = d.data(); else list = list.concat((d.data().eventi || [])); });
    S._sd = list.length ? list : null; applyStorico();
  }, () => {});
  db.collection('eventi').onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { next[d.id] = pending[d.id] ? deepMerge(d.data(), pending[d.id]) : d.data(); });
    S.eventi = next; S.dbState = 'ok'; scheduleRender();
  }, err => { S.dbState = 'off'; scheduleRender(); });
})();
</script>
